<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal Informatika</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #e0f2f1;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wadah {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #00695c;
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* === HALAMAN LOGIN === */
        .halaman-login {
            display: block;
        }
        .halaman-kuis, .halaman-hasil {
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #004d40;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #b2dfdb;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            cursor: pointer;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #00796b;
        }

        /* === KOTAK PENCARIAN NAMA === */
        .kotak-pencarian {
            position: relative;
        }
        #cariNama {
            margin-bottom: 8px;
        }
        .daftar-nama-hasil {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 280px;
            overflow-y: auto;
            background: white;
            border: 2px solid #b2dfdb;
            border-top: none;
            border-radius: 0 0 8px 8px;
            z-index: 100;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .saran-nama {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #e0f2f1;
        }
        .saran-nama:hover {
            background: #e0f2f1;
        }
        .saran-nama:last-child {
            border-bottom: none;
        }
        .tidak-ada-hasil {
            padding: 12px;
            color: #757575;
            font-style: italic;
            text-align: center;
        }

        .btn-mulai {
            width: 100%;
            padding: 12px;
            background: #00796b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-mulai:hover {
            background: #004d40;
        }
        .pesan-error {
            color: #d32f2f;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }
        .sembunyi {
            display: none !important;
        }

        /* === HALAMAN KUIS === */
        .info {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            background: #b2dfdb;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .identitas {
            width: 100%;
            font-size: 13px;
            color: #004d40;
            margin-bottom: 5px;
        }

        .soal {
            background: #f1f8e9;
            padding: 18px;
            border-radius: 8px;
            border-left: 5px solid #558b2f;
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.6;
        }

        .pilihan {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tombol {
            padding: 12px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            background: #4fc3f7;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .tombol:hover:not(:disabled) {
            background: #0288d1;
            color: white;
            transform: translateX(3px);
        }

        .tombol:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #pesan {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        #tombolLanjut {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            display: none;
        }

        #tombolLanjut:hover {
            background: #f57c00;
        }

        /* === HALAMAN HASIL === */
        .halaman-hasil {
            text-align: center;
            padding: 20px;
        }
        .halaman-hasil h2 {
            color: #2e7d32;
            margin-bottom: 15px;
        }
        .skor {
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0;
            color: #00796b;
        }
        .btn-ulang {
            margin-top: 20px;
            padding: 12px 24px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-ulang:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>
    <div class="wadah">
        <!-- HALAMAN LOGIN -->
        <div class="halaman-login" id="halamanLogin">
            <h1>MASUK SOAL LATIHAN INFORMATIKA</h1>
            <div class="form-group">
                <label>Nama Lengkap Siswa</label>
                <div class="kotak-pencarian">
                    <input type="text" id="cariNama" placeholder="Ketik nama atau huruf (contoh: a)..." autocomplete="off">
                    <div class="daftar-nama-hasil sembunyi" id="daftarSaranNama"></div>
                </div>
            </div>
            <div class="form-group sembunyi" id="kolomNamaLain">
                <label>Tuliskan Nama Kamu</label>
                <input type="text" id="inputNamaLain" placeholder="Masukkan nama lengkapmu..." autocomplete="off">
            </div>
            <div class="form-group">
                <label>Kelas</label>
                <select id="inputKelas">
                    <option value="">-- Pilih Kelas --</option>
                    <option value="X.1">X.1</option>
                    <option value="X.2">X.2</option>
                    <option value="XI">XI</option>
                    <option value="XII.1">XII.1</option>
                    <option value="XII.2">XII.2</option>
                </select>
            </div>
            <button class="btn-mulai" id="btnMulai">MULAI KUIS</button>
            <div class="pesan-error" id="pesanError">Silakan Pilih Nama dan Kelas terlebih dahulu!</div>
        </div>

        <!-- HALAMAN KUIS -->
        <div class="halaman-kuis" id="halamanKuis">
            <h1>SOAL LATIHAN INFORMATIKA</h1>
            <div class="info">
                <div class="identitas">Nama: <span id="tampilNama"></span> | Kelas: <span id="tampilKelas"></span></div>
                <div>Poin: <span id="nilai">0</span></div>
                <div>Soal <span id="noSoal">1</span> / 10</div>
            </div>

            <div class="soal">
                <p id="teksSoal"></p>
            </div>

            <div class="pilihan" id="kotakPilihan"></div>
            <div id="pesan"></div>
            <button id="tombolLanjut">Soal Berikutnya</button>
        </div>

        <!-- HALAMAN HASIL -->
        <div class="halaman-hasil" id="halamanHasil">
            <h2>🎉 KUIS SELESAI!</h2>
            <p>Nama: <span id="hasilNama"></span></p>
            <p>Kelas: <span id="hasilKelas"></span></p>
            <div class="skor">Skor Kamu: <span id="skorAkhir"></span> / 100</div>
            <p id="pesanNilai"></p>
            <button class="btn-ulang" onclick="location.reload()">KERJAKAN ULANG</button>
        </div>
    </div>

    <script>
        // === DAFTAR SEMUA NAMA SISWA ===
        const daftarSemuaNama = [
            "AGUNG LASMANA", "AHMAD MAULANA", "ANA NI'MATUL ULAA", "ARYA SAPUTRA",
            "BUNGA SAFITRI", "DEA RATNA", "DIMAS ADITIA", "EDWARD FABIANO",
            "FAHRANI SALSABILA KURNIAWAN", "FIFIH NAILAH", "FUJIYANTI ARAFAH",
            "HALIMAH REGINA PUTRI", "KEYSA AGITA PUTRI", "MOH SAKU", "MUCHAROPI",
            "M. REZA", "NUR AZIZAH", "REFA", "RENALDI SETIAWAN", "SUPRIYOGI",
            "SYIFAA KHOIRUNNISA", "UMU AIMAN", "VIDIYAH AYUNI", "WIDIA NINGSIH",
            "ALENI", "AHMAD MAULUDDIN", "AKHMAD KAELANI", "ASYARA ADILLA KHANZA",
            "BENTAR AL HUSNA", "CHIKA RAMADHANI", "DZAKY ALMER JAMAIL", "ERIKA HAMID",
            "FAHAT DWI SAPUTRA", "FADHEA DWI VANNESA", "HAFIZAH NURUL AEINI",
            "HABIBUN NURULLAH", "KHOERUL AZAM", "KENANGA AFISTA", "MARIO FATAN DERMAWAN",
            "MUHAMAD DAVIN FERDIANSYAH", "MUHAMMAD ARIF AMIRUDDIN", "NURHALIMAH",
            "PUTRI ANGGRAENI", "REZA", "RIFAT HIDAYAT", "SYAHPUTRA", "SELY RAHMADANI",
            "SAMIUN", "ZULFIKAR", "ABDUL HAMID", "AGUNG PRAMANA", "ANDIKA RIZKI PUTRA",
            "APRIYAN", "ASIYA", "DWI ANDIN JUANITA", "EFAN APRIANSYAH", "GALANG DWI PRATAMA",
            "HENGKI", "ILHAM NOOR FAMI", "MEGA MUSTIKA", "MOH ADILATUN", "MOH FAZRI AMRULLAH",
            "MOH. ARIF MAULANA", "MOH. MAULANA", "MOH. RIZAL", "MOHAMAD REVALDI",
            "MOHAMMAD FARID HUSEN", "MOHAMMAD SHOPIULLAH", "MUFLIKHA DWI WAHYUNI",
            "MUHAMAD ARSYADATUL UMAM", "MUHAMAD FADIL FADILLAH", "MUHAMMAD NUR ZAFIN",
            "MUHAMMAD SANDIH", "NATASYA RAMADHANTI", "NOVA ALFIANA", "RAMADAN",
            "RISKY MAULANA", "SEKAR KEMUNING", "SELVI", "SHERLY KHASANAH", "SITI AFNI AULIYAH",
            "SOLEHA WIDIA WATI", "SULAIMAN", "SYIFATURRAHMAWATI", "ADEL LITA", "ALHANA",
            "ALPIN MUBAROK", "ANDI IBRAHIM BAANGGA RAHAWARIN", "DIKI FIRMANSYAH",
            "FADLI FASHA SHAPUTRA", "GALIH VIJAR NUGRAHA", "IJJATUL HIMAH",
            "LIOTY ATTALA PRIYANA", "MARSELA AURILIANI PUTRI", "MUHAMMAD IZARRUL AZHAR",
            "MUHAMMAD RIZQI ASHSHUBHI", "NAIF DERMAWAN", "NINA NATASYA", "NURUL AINI",
            "PUTRI NURITA", "SAEFUL MU'MIN AL MADANI", "SALMAH", "SITI FITRIYAH",
            "SUNADI", "TATIH AGUSTINA", "ZIDNI ILMAN", "AHMAD RIYANI", "ALDIANSYAH",
            "ANGGA", "ARMAN", "AULIA RAHMAWATI", "DAMAR ADIYASA", "GIO RAHMADHAN",
            "IMAN MAULANA", "LUVI SAHRUL", "MELISA", "MOHAMMAD AFIF MAULANA",
            "MOHAMMAD YASIN ARAFAT", "NABILA AZZALIA PUTRI", "NATASHA SAFFA AZAHRA",
            "NILA LESTARI", "NUR AZIZAH", "SAFIRA DEWI", "SEMI AJI DILAGA",
            "SITI RAHMA YANI", "SITI SHOLEHA", "SRI HAYATI", "SUCI SEPTIANI",
            "SUTA", "TIARA PUTRI FEBRIYANTI", "--- LAINNYA ---"
        ];

        // === 10 SOAL PILIHAN GANDA ===
        const daftarSoal = [
            { soal: "1. Web Browser merupakan tools utama yang digunakan untuk menampilkan halaman web, Manakah yang bukan Web Browser yang sering digunakan di PC ...", pilihan: ["A. Google Chrome", "B. Safari", "C. FireFox", "D. Microsoft Store", "E. Microsoft Edge"], benar: 3 },
            { soal: "2. Kepanjangan dari HTML adalah ...", pilihan: ["A. Hyper Text Markup Language", "B. High Tech Modern Language", "C. Hyperlink Text Management Language", "D. Home Tool Markup Language", "E. Hyper Text Multi Language"], benar: 0 },
            { soal: "3. Aplikasi yang digunakan untuk membuat HTML ...", pilihan: ["A. Notepad++", "B. Google Chrome", "C. RAM", "D. WPS", "E. Notepad"], benar: 0 },
            { soal: "4. Penulisan paragraf dalam html...", pilihan: ["A. <paragraf>", "B. <p>", "C. paragraf", "D. p", "E. semua benar"], benar: 1 },
            { soal: "5. Untuk membuat judul pada HTML menggunakan tag ...", pilihan: ["A. <h1>", "B. <h2>", "C. <title>", "D. <body>", "E. <head>"], benar: 2 },
            { soal: "6. Tag penutup untuk head yang benar adalah ...", pilihan: ["A. <head>", "B. <h2>", "C. <title>", "D. <body>", "E. </head>"], benar: 4 },
            { soal: "7. HTML diciptakan pada tahun...", pilihan: ["A. 1994", "B. 1997", "C. 1990", "D. 1992", "E. 1995"], benar: 1 },
            { soal: "8. Salah satu manfaat HTML5 adalah...", pilihan: ["A. Penanganan error yang ribet", "B. Tampilan tidak menarik", "C. Website Responsive", "D. Tidak menggukan JavaScript", "E. Semua Benar"], benar: 2 },
            { soal: "9. Penulisan tag pembuka dan tag penutup yang benar adalah...", pilihan: ["A. <p>....</p>", "B. <head>....</p>", "C. <p>....</head>", "D. <html>....>/html<", "E. ><head....></head"], benar: 0 },
            { soal: "10. Untuk mendefinisikan Struktur dan elemen menggunakan karakter disebut...", pilihan: ["A. Tag", "B. Koding", "C. Elemen", "D. Struktur", "E. Semua benar"], benar: 0 }
        ];

        // === VARIABEL ===
        let nomor = 0;
        let poin = 0;
        let namaSiswa = "";
        let kelasSiswa = "";
        const NILAI_SOAL = 10; // Nilai per soal

        // === ELEMEN HALAMAN ===
        const halamanLogin = document.getElementById("halamanLogin");
        const halamanKuis = document.getElementById("halamanKuis");
        const halamanHasil = document.getElementById("halamanHasil");
        const cariNama = document.getElementById("cariNama");
        const daftarSaranNama = document.getElementById("daftarSaranNama");
        const kolomNamaLain = document.getElementById("kolomNamaLain");
        const inputNamaLain = document.getElementById("inputNamaLain");
        const inputKelas = document.getElementById("inputKelas");
        const btnMulai = document.getElementById("btnMulai");
        const pesanError = document.getElementById("pesanError");

        const tampilNama = document.getElementById("tampilNama");
        const tampilKelas = document.getElementById("tampilKelas");
        const teksSoal = document.getElementById("teksSoal");
        const kotakPilihan = document.getElementById("kotakPilihan");
        const nilai = document.getElementById("nilai");
        const noSoal = document.getElementById("noSoal");
        const pesan = document.getElementById("pesan");
        const tombolLanjut = document.getElementById("tombolLanjut");

        const hasilNama = document.getElementById("hasilNama");
        const hasilKelas = document.getElementById("hasilKelas");
        const skorAkhir = document.getElementById("skorAkhir");
        const pesanNilai = document.getElementById("pesanNilai");

        // === FITUR PENCARIAN NAMA ===
        cariNama.addEventListener("input", () => {
            const kataKunci = cariNama.value.trim().toUpperCase();
            daftarSaranNama.innerHTML = "";
            kolomNamaLain.classList.add("sembunyi");

            if (kataKunci === "") {
                daftarSaranNama.classList.add("sembunyi");
                return;
            }

            const hasilCari = daftarSemuaNama.filter(nama => nama.toUpperCase().includes(kataKunci));

            if (hasilCari.length === 0) {
                daftarSaranNama.innerHTML = "<div class='tidak-ada-hasil'>Nama tidak ditemukan. Silakan tulis sendiri.</div>";
                daftarSaranNama.classList.remove("sembunyi");
                return;
            }

            hasilCari.forEach(nama => {
                const opsi = document.createElement("div");
                opsi.className = "saran-nama";
                opsi.textContent = nama;
                opsi.onclick = () => {
                    if (nama === "--- LAINNYA ---") {
                        cariNama.value = "";
                        kolomNamaLain.classList.remove("sembunyi");
                        inputNamaLain.focus();
                    } else {
                        cariNama.value = nama;
                    }
                    daftarSaranNama.classList.add("sembunyi");
                };
                daftarSaranNama.appendChild(opsi);
            });

            daftarSaranNama.classList.remove("sembunyi");
        });

        document.addEventListener("click", (e) => {
            if (!cariNama.contains(e.target) && !daftarSaranNama.contains(e.target)) {
                daftarSaranNama.classList.add("sembunyi");
            }
        });

        // === FUNGSI MULAI KUIS ===
        btnMulai.addEventListener("click", () => {
            namaSiswa = kolomNamaLain.classList.contains("sembunyi") ? cariNama.value.trim() : inputNamaLain.value.trim();
            kelasSiswa = inputKelas.value.trim();

            if (namaSiswa === "" || kelasSiswa === "") {
                pesanError.textContent = kolomNamaLain.classList.contains("sembunyi") && namaSiswa === ""
                    ? "Silakan Ketik dan Pilih Nama terlebih dahulu!"
                    : "Silakan Lengkapi Nama dan Kelas terlebih dahulu!";
                pesanError.style.display = "block";
                return;
            }

            pesanError.style.display = "none";
            halamanLogin.style.display = "none";
            halamanKuis.style.display = "block";
            tampilNama.textContent = namaSiswa;
            tampilKelas.textContent = kelasSiswa;
            tampilSoal();
        });

        // === TAMPILKAN SOAL ===
        function tampilSoal() {
            const soalSekarang = daftarSoal[nomor];
            teksSoal.textContent = soalSekarang.soal;
            kotakPilihan.innerHTML = "";
            pesan.style.display = "none";
            tombolLanjut.style.display = "none";
            noSoal.textContent = nomor + 1;

            soalSekarang.pilihan.forEach((pilih, idx) => {
                const btn = document.createElement("button");
                btn.className = "tombol";
                btn.textContent = pilih;
                btn.onclick = () => cekJawaban(idx, btn);
                kotakPilihan.appendChild(btn);
            });
        }

        // === CEK JAWABAN (SETIAP BENAR +10 POIN) ===
        function cekJawaban(pilihanUser, tombolPilih) {
            const semuaTombol = document.querySelectorAll(".tombol");
            semuaTombol.forEach(b => b.disabled = true);
            pesan.style.display = "block";

            if (pilihanUser === daftarSoal[nomor].benar) {
                poin += NILAI_SOAL;
                nilai.textContent = poin;
                pesan.textContent = `✅ JAWABAN BENAR! Poin bertambah ${NILAI_SOAL}`;
                pesan.style.background = "#c8e6c9";
                pesan.style.color = "#2e7d32";
                tombolPilih.style.background = "#4caf50";
            } else {
                pesan.textContent = "❌ JAWABAN SALAH";
                pesan.style.background = "#ffcdd2";
                pesan.style.color = "#c62828";
                tombolPilih.style.background = "#f44336";
            }

            tombolLanjut.style.display = "block";
        }

        // === TOMBOL LANJUT ===
        tombolLanjut.onclick = () => {
            nomor++;
            if (nomor < daftarSoal.length) {
                tampilSoal();
            } else {
                tampilHasil();
            }
        };

        // === TAMPILKAN HASIL AKHIR ===
        function tampilHasil() {
            halamanKuis.style.display = "none";
            halamanHasil.style.display = "block";
            hasilNama.textContent = namaSiswa;
            hasilKelas.textContent = kelasSiswa;
            skorAkhir.textContent = poin;

            if (poin >= 90) pesanNilai.textContent = "🌟 Luar biasa! Penguasaan materi sangat baik.";
            else if (poin >= 70) pesanNilai.textContent = "👍 Bagus! Tingkatkan lagi pemahamanmu.";
            else pesanNilai.textContent = "💪 Semangat belajar lagi ya, pasti bisa lebih baik!";
        }
    </script>
</body>
</html>
