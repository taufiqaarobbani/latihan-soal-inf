<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Login & Ujian Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin: 0 auto;
        }

        .login-card {
            max-width: 450px;
        }

        .card h2 {
            text-align: center;
            color: #333;
            margin-bottom: 24px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #2a5298;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #1e3c72;
        }

        /* Styling Modal Result & Info */
        .result-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .result-box.error {
            background-color: #ffebee;
            border: 1px solid #ef9a9a;
            color: #c62828;
        }

        .badge-paket {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
            background-color: #1565c0;
        }

        /* Styling Lembar Ujian */
        #examArea {
            display: none;
        }

        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-info p {
            font-size: 0.95rem;
            color: #444;
            margin-bottom: 4px;
        }

        .soal-item {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ddd;
        }

        .soal-text {
            font-size: 1rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            margin-bottom: 8px;
        }

        .option-item label {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-item label:hover {
            background-color: #f5f5f5;
            border-color: #2a5298;
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
            accent-color: #2a5298;
        }

        /* Result Section */
        #scoreResult {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1e3c72;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: bold;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .score-details {
            font-size: 1.05rem;
            color: #444;
            margin-bottom: 20px;
            line-height: 1.8;
        }
    </style>
</head>

    <div class="container">
        <!-- Form Login Card -->
        <div id="loginCard" class="card login-card">
            <h2>Portal Login Ujian</h2>
            
            <form id="loginForm">
                <!-- Pilihan Kelas -->
                <div class="form-group">
                    <label for="kelas">Pilih Kelas:</label>
                    <select id="kelas" required onchange="loadNamaSiswa()">
                        <option value="" disabled selected>-- Pilih Kelas --</option>
                        <option value="Kelas X.1">Kelas X.1</option>
                        <option value="Kelas X.2">Kelas X.2</option>
                        <option value="Kelas XI">Kelas XI</option>
                        <option value="Kelas XII.1">Kelas XII.1</option>
                        <option value="Kelas XII.2">Kelas XII.2</option>
                    </select>
                </div>

                <!-- Pilihan Nama Siswa -->
                <div class="form-group">
                    <label for="nama">Pilih Nama Siswa:</label>
                    <select id="nama" required disabled>
                        <option value="" disabled selected>-- Pilih Kelas Terlebih Dahulu --</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Masuk Ujian</button>
            </form>

            <div id="resultBox" class="result-box"></div>
        </div>

        <!-- Area Ujian Online -->
        <div id="examArea" class="card">
            <div class="exam-header">
                <div class="user-info">
                    <p><strong>Siswa:</strong> <span id="dispNama"></span></p>
                    <p><strong>Kelas:</strong> <span id="dispKelas"></span></p>
                </div>
                <div>
                    <span id="dispPaket" class="badge-paket"></span>
                </div>
            </div>

            <form id="examForm">
                <div id="questionsContainer"></div>
                <button type="submit" class="btn-submit" style="margin-top: 20px; background-color: #27ae60;">Kirim & Selesaikan Ujian</button>
            </form>
        </div>

        <!-- Area Hasil Ujian -->
        <div id="scoreResult" class="card">
            <h2>Hasil Ujian Online</h2>
            <div class="score-circle" id="finalScore">0</div>
            <div class="score-details" id="scoreDetails"></div>
            <button onclick="location.reload()" class="btn-submit">Selesai & Keluar</button>
        </div>
    </div>

        let activeSoalList = [];

        // Dynamic Loading Dropdown Nama Siswa
        function loadNamaSiswa() {
            const kelasSelect = document.getElementById("kelas");
            const namaSelect = document.getElementById("nama");
            const selectedKelas = kelasSelect.value;

            namaSelect.innerHTML = '<option value="" disabled selected>-- Pilih Nama --</option>';
            namaSelect.disabled = true;

            if (selectedKelas && dataSiswa[selectedKelas]) {
                dataSiswa[selectedKelas].forEach(nama => {
                    const option = document.createElement("option");
                    option.value = nama;
                    option.textContent = nama;
                    namaSelect.appendChild(option);
                });
                namaSelect.disabled = false;
            }
        }

        // Handle Event Form Submit / Login
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const kelas = document.getElementById("kelas").value;
            const nama = document.getElementById("nama").value;
            const resultBox = document.getElementById("resultBox");

            if (!kelas || !nama) {
                resultBox.className = "result-box error";
                resultBox.innerHTML = "Harap lengkapi pilihan Kelas dan Nama!";
                resultBox.style.display = "block";
                return;
            }

            // Aturan Penentuan Paket Soal
            let namaPaket = "";
            if (kelas === "Kelas XII.1" || kelas === "Kelas XII.2") {
                namaPaket = "Paket A (HTML)";
                activeSoalList = paketSoalA;
            } else if (kelas === "Kelas X.1" || kelas === "Kelas X.2" || kelas === "Kelas XI") {
                namaPaket = "Paket B (C++)";
                activeSoalList = paketSoalB;
            }

            // Menyembunyikan Login, Menampilkan Ujian
            document.getElementById("loginCard").style.display = "none";
            document.getElementById("dispNama").textContent = nama;
            document.getElementById("dispKelas").textContent = kelas;
            document.getElementById("dispPaket").textContent = namaPaket;

            renderSoal();
            document.getElementById("examArea").style.display = "block";
        });

        // Function Render Soal Ujian ke HTML
        function renderSoal() {
            const container = document.getElementById("questionsContainer");
            container.innerHTML = "";

            activeSoalList.forEach((item, index) => {
                const divSoal = document.createElement("div");
                divSoal.className = "soal-item";

                let optionsHTML = "";
                item.pilihan.forEach((pilihanText, optIndex) => {
                    optionsHTML += `
                        <li class="option-item">
                            <label>
                                <input type="radio" name="soal_${index}" value="${optIndex}" required>
                                ${escapeHTML(pilihanText)}
                            </label>
                        </li>
                    `;
                });

                divSoal.innerHTML = `
                    <div class="soal-text">${escapeHTML(item.soal)}</div>
                    <ul class="options-list">
                        ${optionsHTML}
                    </ul>
                `;

                container.appendChild(divSoal);
            });
        }

        // Handle Submit Ujian & Perhitungan Nilai
        document.getElementById("examForm").addEventListener("submit", function(e) {
            e.preventDefault();

            let benarCount = 0;
            const totalSoal = activeSoalList.length;

            activeSoalList.forEach((item, index) => {
                const selectedOption = document.querySelector(`input[name="soal_${index}"]:checked`);
                if (selectedOption && parseInt(selectedOption.value) === item.benar) {
                    benarCount++;
                }
            });

            const salahCount = totalSoal - benarCount;
            const totalNilai = benarCount * 2; // Setiap 1 soal bernilai 2 poin

            // Tampilkan Halaman Hasil
            document.getElementById("examArea").style.display = "none";
            document.getElementById("finalScore").textContent = totalNilai;
            document.getElementById("scoreDetails").innerHTML = `
                Jawaban Benar: <strong>${benarCount}</strong> soal (${benarCount * 2} Poin)<br>
                Jawaban Salah: <strong>${salahCount}</strong> soal<br>
                Total Soal: <strong>${totalSoal}</strong> Butir
            `;
            document.getElementById("scoreResult").style.display = "block";
        });

        // Helper untuk keamanan penulisan Tag HTML agar tidak ter-render sebagai elemen
        function escapeHTML(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
