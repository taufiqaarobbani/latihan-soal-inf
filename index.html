            margin: 0;
            padding: 0;

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin: 0 auto;
        }

        .login-card {
            max-width: 450px;
        }

        .card h2 {
            text-align: center;
            color: #333;
            margin-bottom: 24px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #2a5298;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #1e3c72;
        }

        .result-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .result-box.error {
            background-color: #ffebee;
            border: 1px solid #ef9a9a;
            color: #c62828;
        }

        .badge-paket {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
            background-color: #1565c0;
        }

        #examArea { display: none; }

        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-info p {
            font-size: 0.95rem;
            color: #444;
            margin-bottom: 4px;
        }

        .timer-box {
            background-color: #e74c3c;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .number-nav-container {
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .number-nav-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #6c757d;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
        }

        .btn-number {
            padding: 8px 0;
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .btn-number:hover { background-color: #dee2e6; }
        .btn-number.active {
            background-color: #2a5298;
            color: white;
            border-color: #1e3c72;
            box-shadow: 0 0 0 2px rgba(42, 82, 152, 0.3);
        }
        .btn-number.answered {
            background-color: #27ae60;
            color: white;
            border-color: #219653;
        }
        .btn-number.active.answered {
            background-color: #1e7e34;
            border-color: #114b1f;
            box-shadow: 0 0 0 2px rgba(39, 174, 96, 0.4);
        }

        .soal-card {
            background: #fff;
            padding: 10px 5px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .soal-item { display: none; }
        .soal-item.active { display: block; }

        .soal-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options-list { list-style: none; }
        .option-item { margin-bottom: 10px; }
        .option-item label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-item label:hover {
            background-color: #f5f5f5;
            border-color: #2a5298;
        }
        .option-item input[type="radio"] {
            margin-right: 12px;
            accent-color: #2a5298;
            transform: scale(1.1);
        }

        .exam-navigation {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .btn-nav {
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-nav:hover { background-color: #5a6268; }
        .btn-nav:disabled {
            background-color: #e0e0e0;
            color: #a0a0a0;
            cursor: not-allowed;
        }

        #scoreResult {
            display: none;
            text-align: center;
            padding: 25px;
        }

        .identitas-hasil {
            background: #f0f4f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
            border-left: 4px solid #2a5298;
        }
        .identitas-hasil p {
            margin-bottom: 5px;
            font-size: 1rem;
            color: #333;
        }
        .identitas-hasil strong { color: #1e3c72; }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1e3c72;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: bold;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .score-details {
            font-size: 1.05rem;
            color: #444;
            margin-bottom: 20px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="loginCard" class="card login-card">
            <h2>Portal Login Ujian</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="kelas">Pilih Kelas:</label>
                    <select id="kelas" required onchange="loadNamaSiswa()">
                        <option value="" disabled selected>-- Pilih Kelas --</option>
                        <option value="Kelas X.1">Kelas X.1</option>
                        <option value="Kelas X.2">Kelas X.2</option>
                        <option value="Kelas XI">Kelas XI</option>
                        <option value="Kelas XII.1">Kelas XII.1</option>
                        <option value="Kelas XII.2">Kelas XII.2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nama">Pilih Nama Siswa:</label>
                    <select id="nama" required disabled>
                        <option value="" disabled selected>-- Pilih Kelas Terlebih Dahulu --</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Masuk Ujian</button>
            </form>
            <div id="resultBox" class="result-box"></div>
        </div>

        <div id="examArea" class="card">
            <div class="exam-header">
                <div class="user-info">
                    <p><strong>Siswa:</strong> <span id="dispNama"></span></p>
                    <p><strong>Kelas:</strong> <span id="dispKelas"></span></p>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="dispPaket" class="badge-paket"></span>
                    <div class="timer-box"><span>⏱️</span><span id="timerDisplay">60:00</span></div>
                </div>
            </div>
            <div class="number-nav-container">
                <div class="number-nav-title">Navigasi Soal</div>
                <div id="numberGrid" class="number-grid"></div>
            </div>
            <form id="examForm">
                <div class="soal-card"><div id="questionsContainer"></div></div>
                <div class="exam-navigation">
                    <button type="button" id="btnPrev" class="btn-nav" onclick="changeQuestion(-1)">← Sebelumnya</button>
                    <button type="button" id="btnNext" class="btn-nav" onclick="changeQuestion(1)">Selanjutnya →</button>
                </div>
                <button type="submit" class="btn-submit" style="margin-top: 25px; background-color: #27ae60;">Kirim & Selesaikan Ujian</button>
            </form>
        </div>

        <div id="scoreResult" class="card">
            <h2>Hasil Ujian Online</h2>
            <div class="identitas-hasil">
                <p><strong>Nama Lengkap:</strong> <span id="hasilNama"></span></p>
                <p><strong>Kelas:</strong> <span id="hasilKelas"></span></p>
                <p><strong>Paket Soal:</strong> <span id="hasilPaket"></span></p>
            </div>
            <div class="score-circle" id="finalScore">0</div>
            <div class="score-details" id="scoreDetails"></div>
            <button onclick="location.reload()" class="btn-submit">Selesai & Keluar</button>
        </div>
    </div>

    { soal: "12. Struktur pemilihan yang hanya menjalankan perintah jika kondisinya benar adalah ...", pilihan: ["A. if", "B. if...else", "C. for", "D. while", "E. do...while"], benar: 0 },
    { soal: "13. Kata kunci yang digunakan untuk pilihan lain jika syarat if tidak terpenuhi adalah ...", pilihan: ["A. else", "B. switch", "C. case", "D. break", "E. default"], benar: 0 },
    { soal: "14. Perulangan yang paling tepat jika sudah diketahui jumlah perulangannya adalah ...", pilihan: ["A. if", "B. for", "C. while", "D. do...while", "E. switch"], benar: 1 },
    { soal: "15. Perulangan yang akan menjalankan tubuh perintah minimal satu kali meskipun kondisi salah adalah ...", pilihan: ["A. for", "B. while", "C. do...while", "D. if", "E. switch"], benar: 2 },
    { soal: "16. Bagian dari perulangan for yang berfungsi untuk mengubah nilai penghitung adalah ...", pilihan: ["A. Inisialisasi", "B. Kondisi", "C. Peningkatan/Penurunan", "D. Tanda titik koma", "E. Blok perintah"], benar: 2 },
    { soal: "17. Kata kunci untuk melanjutkan ke putaran perulangan berikutnya adalah ...", pilihan: ["A. break", "B. continue", "C. stop", "D. exit", "E. return"], benar: 1 },
    { soal: "18. Fungsi yang digunakan untuk mengembalikan nilai ke sistem operasi pada fungsi main adalah ...", pilihan: ["A. return", "B. cout", "C. cin", "D. break", "E. send"], benar: 0 },
    { soal: "19. Kumpulan kode yang memiliki nama dan dapat dipanggil berulang kali disebut ...", pilihan: ["A. Variabel", "B. Fungsi", "C. Tipe data", "D. Komentar", "E. Kelas"], benar: 1 },
    { soal: "20. Nilai yang dikirimkan saat memanggil fungsi disebut ...", pilihan: ["A. Variabel", "B. Parameter/Argumen", "C. Tipe data", "D. Hasil", "E. Fungsi"], benar: 1 },
   ];
        ];

        let activeSoalList = [];
        let currentQuestionIndex = 0;
        let namaSiswaTerpilih = "";
        let kelasSiswaTerpilih = "";
        let paketSoalTerpilih = "";
        let totalTimeInSeconds = 3600; 
        let timerInterval;

        function loadNamaSiswa() {
            const kelasSelect = document.getElementById("kelas");
            const namaSelect = document.getElementById("nama");
            const selectedKelas = kelasSelect.value;
            namaSelect.innerHTML = '<option value="" disabled selected>-- Pilih Nama --</option>';
            namaSelect.disabled = true;
            if (selectedKelas && dataSiswa[selectedKelas]) {
                dataSiswa[selectedKelas].forEach(nama => {
                    const option = document.createElement("option");
                    option.value = nama;
                    option.textContent = nama;
                    namaSelect.appendChild(option);
                });
                namaSelect.disabled = false;
            }
        }

        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const kelas = document.getElementById("kelas").value;
            const nama = document.getElementById("nama").value;
            const resultBox = document.getElementById("resultBox");
            if (!kelas || !nama) {
                resultBox.className = "result-box error";
                resultBox.innerHTML = "Harap lengkapi pilihan Kelas dan Nama!";
                resultBox.style.display = "block";
                return;
            }
            namaSiswaTerpilih = nama;
            kelasSiswaTerpilih = kelas;
            if (kelas === "Kelas XII.1" || kelas === "Kelas XII.2") {
                paketSoalTerpilih = "Paket A (HTML)";
                activeSoalList = paketSoalA;
            } else {
                paketSoalTerpilih = "Paket B (C++)";
                activeSoalList = paketSoalB;
            }
            document.getElementById("loginCard").style.display = "none";
            document.getElementById("dispNama").textContent = nama;
            document.getElementById("dispKelas").textContent = kelas;
            document.getElementById("dispPaket").textContent = paketSoalTerpilih;
            renderSoal();
            document.getElementById("examArea").style.display = "block";
            startTimer();
        });

        function startTimer() {
            const timerDisplay = document.getElementById("timerDisplay");
            timerInterval = setInterval(() => {
                let minutes = Math.floor(totalTimeInSeconds / 60);
                let seconds = totalTimeInSeconds % 60;
                timerDisplay.textContent = `${minutes < 10 ? "0" + minutes : minutes}:${seconds < 10 ? "0" + seconds : seconds}`;
                if (totalTimeInSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert("Waktu habis! Jawaban dikumpulkan otomatis.");
                    processExamResult();
                } else {
                    totalTimeInSeconds--;
                }
            }, 1000);
        }

        function renderSoal() {
            const container = document.getElementById("questionsContainer");
            const numberGrid = document.getElementById("numberGrid");
            container.innerHTML = "";
            numberGrid.innerHTML = "";
            currentQuestionIndex = 0;
            activeSoalList.forEach((item, index) => {
                const btnNum = document.createElement("button");
                btnNum.type = "button";
                btnNum.className = `btn-number ${index === 0 ? 'active' : ''}`;
                btnNum.id = `btn-num-${index}`;
                btnNum.textContent = index + 1;
                btnNum.onclick = () => jumpToQuestion(index);
                numberGrid.appendChild(btnNum);

                const divSoal = document.createElement("div");
                divSoal.className = `soal-item ${index === 0 ? 'active' : ''}`;
                divSoal.id = `soal-item-${index}`;
                let optionsHTML = "";
                item.pilihan.forEach((pilihanText, optIndex) => {
                    optionsHTML += `<li class="option-item"><label><input type="radio" name="soal_${index}" value="${optIndex}" onchange="markAsAnswered(${index})"> ${pilihanText}</label></li>`;
                });
                divSoal.innerHTML = `<div class="soal-text">${item.soal}</div><ul class="options-list">${optionsHTML}</ul>`;
                container.appendChild(divSoal);
            });
            updateNavButtons();
        }

        function markAsAnswered(index) { document.getElementById(`btn-num-${index}`)?.classList.add("answered"); }
        function jumpToQuestion(index) {
            document.getElementById(`soal-item-${currentQuestionIndex}`).classList.remove("active");
            document.getElementById(`btn-num-${currentQuestionIndex}`).classList.remove("active");
            currentQuestionIndex = index;
            document.getElementById(`soal-item-${currentQuestionIndex}`).classList.add("active");
            document.getElementById(`btn-num-${currentQuestionIndex}`).classList.add("active");
            updateNavButtons();
        }
        function changeQuestion(step) {
            const newIndex = currentQuestionIndex + step;
            if (newIndex >= 0 && newIndex < activeSoalList.length) jumpToQuestion(newIndex);
        }
        function updateNavButtons() {
            document.getElementById("btnPrev").disabled = currentQuestionIndex === 0;
            document.getElementById("btnNext").disabled = currentQuestionIndex === activeSoalList.length - 1;
        }

        document.getElementById("examForm").addEventListener("submit", function(e) {
            e.preventDefault();
            if (confirm("Yakin ingin menyelesaikan ujian?")) {
                clearInterval(timerInterval);
                processExamResult();
            }
        });

        // FUNGSI KIRIM DATA KE GOOGLE SHEET
        async function kirimKeGoogleSheet(dataHasil) {
            try {
                const response = await fetch(GOOGLE_SHEET_WEBHOOK, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dataHasil)
                });
                console.log("✅ Jawaban terkirim ke Google Sheet");
            } catch (err) {
                console.error("❌ Gagal kirim:", err);
            }
        }

        function processExamResult() {
            let skor = 0, benarCount = 0, salahCount = 0, kosongCount = 0;
            const totalSoal = activeSoalList.length;
            const poinPerSoal = 100 / totalSoal;
            let daftarJawaban = [];

            activeSoalList.forEach((item, index) => {
                const selectedOption = document.querySelector(`input[name="soal_${index}"]:checked`);
                let jawabanSiswa = "-";
                if (selectedOption) {
                    jawabanSiswa = parseInt(selectedOption.value);
                    if (jawabanSiswa === item.benar) { skor += poinPerSoal; benarCount++; }
                    else { salahCount++; }
                } else { kosongCount++; }
                daftarJawaban.push(jawabanSiswa);
            });

            const finalSkor = Math.round(skor);
            const waktuSelesai = new Date().toLocaleString("id-ID");

            // Susun data lengkap untuk dikirim
            const dataKirim = {
                nama: namaSiswaTerpilih,
                kelas: kelasSiswaTerpilih,
                paket: paketSoalTerpilih,
                waktu: waktuSelesai,
                skor: finalSkor,
                benar: benarCount,
                salah: salahCount,
                kosong: kosongCount,
                jawaban: daftarJawaban.join(",")
            };

            // Kirim ke Google Sheet
            kirimKeGoogleSheet(dataKirim);

            // Tampilkan Hasil
            document.getElementById("examArea").style.display = "none";
            document.getElementById("hasilNama").textContent = namaSiswaTerpilih;
            document.getElementById("hasilKelas").textContent = kelasSiswaTerpilih;
            document.getElementById("hasilPaket").textContent = paketSoalTerpilih;
            document.getElementById("finalScore").textContent = finalSkor;
            document.getElementById("scoreDetails").innerHTML = `
                Total Soal: <strong>${totalSoal}</strong><br>
                Benar: <strong style="color:green;">${benarCount}</strong> | 
                Salah: <strong style="color:red;">${salahCount}</strong> | 
                Kosong: <strong style="color:orange;">${kosongCount}</strong><br>
                Waktu Selesai: ${waktuSelesai}
            `;
            document.getElementById("scoreResult").style.display = "block";
        }
    </script>
</body>
